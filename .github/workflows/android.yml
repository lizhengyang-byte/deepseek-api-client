name: android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'capacitor.config.ts'
      - 'package.json'
      - 'src/**'
      - 'index.html'
      - 'assets/android/**'
      - 'scripts/android-icons.mjs'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Generate Android project
        run: |
          if [ -d android ]; then
            npx cap sync android
          else
            npx cap add android
            npx cap sync android
          fi

      - name: Generate launcher icons
        run: |
          npx playwright install --with-deps chromium
          node scripts/android-icons.mjs

      - name: Build APK
        run: |
          cd android
          gradle assembleDebug --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-api-client-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "DeepSeek-API-Client-${GITHUB_RUN_NUMBER}-debug.apk"
          gh release view android-latest >/dev/null 2>&1 || \
          gh release create android-latest \
            --title "Android APK（自动构建）" \
            --notes "由 GitHub Actions 自动构建的调试签名 APK，可直接安装到安卓手机。首次安装需在系统设置中允许「安装未知来源应用」。" \
            --latest=false
          gh release upload android-latest "DeepSeek-API-Client-${GITHUB_RUN_NUMBER}-debug.apk" --clobber
