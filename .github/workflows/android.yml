name: android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'capacitor.config.ts'
      - 'package.json'
      - 'src/**'
      - 'index.html'
      - 'assets/android/**'
      - 'native/**'
      - 'scripts/android-icons.mjs'
      - 'scripts/android-patch.mjs'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Android SDK
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          which sdkmanager || ls "$ANDROID_SDK_ROOT"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Generate Android project
        run: |
          if [ -d android ]; then
            npx cap sync android
          else
            npx cap add android
            npx cap sync android
          fi

      - name: Inject native login plugin
        run: node scripts/android-patch.mjs

      - name: Generate launcher icons
        run: |
          npx playwright install --with-deps chromium
          node scripts/android-icons.mjs

      - name: Build APK
        run: |
          cd android
          gradle assembleDebug --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-api-client-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cp android/app/build/outputs/apk/debug/app-debug.apk "DeepSeek-API-Client-0.2.0-debug.apk"
          NOTES=$(printf '%s\n' \
            "可直接安装到安卓手机的安装包（调试签名，非应用商店版本）。" \
            "" \
            "- 包名：com.lizhengyang.deepseekapi" \
            "- 支持 Android 5.1（API 22）及以上" \
            "- 首次安装需在系统设置中允许「安装未知来源应用」" \
            "- v0.2：登录凭证自动识别 + App 内官方账号登录 + 导出链接一键导入" \
            "" \
            "安装后打开「DeepSeek API 版」，粘贴 API Key（或点「在 App 内登录官方账号」）即可登录，计费走你自己的 API 余额。详细说明见 docs/android.md。")
          gh release view android-latest >/dev/null 2>&1 || \
            gh release create android-latest --target "$GITHUB_SHA" --title "安卓 APK · DeepSeek API 版" --notes "$NOTES" --latest=false
          gh release edit android-latest --notes "$NOTES" --latest=false >/dev/null 2>&1 || true
          gh release upload android-latest "DeepSeek-API-Client-0.2.0-debug.apk" --clobber
          gh release view android-latest
